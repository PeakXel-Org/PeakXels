
name: Godot CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Godot Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Import and validate project
        run: godot --headless --editor --path . --quit
